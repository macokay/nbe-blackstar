<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Tile -->
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Warm glow behind the flame -->
    <radialGradient id="glow" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#F97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>

    <!-- Flame layers -->
    <linearGradient id="flame-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="flame-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="flame-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="flame-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>

    <!-- Pellets -->
    <linearGradient id="pellet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C47F" />
      <stop offset="100%" stop-color="#B9823F" />
    </linearGradient>
    <g id="pellet">
      <rect x="-30" y="-12" width="60" height="24" rx="12" fill="url(#pellet-grad)" />
      <ellipse cx="24" cy="0" rx="6" ry="11" fill="#9A6531" />
      <rect x="-22" y="-8" width="34" height="4" rx="2" fill="#FFFFFF" opacity="0.25" />
    </g>
    <radialGradient id="ember" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
    </radialGradient>

    <!-- Badge -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <clipPath id="tile-clip">
      <rect x="32" y="24" width="448" height="448" rx="96" ry="96" />
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="32" y="24" width="448" height="448" rx="96" ry="96" fill="url(#tile-grad)" filter="url(#tile-shadow)" />
  <rect x="33" y="25" width="446" height="446" rx="95" ry="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <g clip-path="url(#tile-clip)">
    <!-- Glow -->
    <circle cx="256" cy="300" r="210" fill="url(#glow)" />

    <!-- Flame -->
    <g filter="url(#flame-shadow)">
      <path d="M256 92 C 300 158, 354 200, 354 282 C 354 342, 310 380, 256 380 C 202 380, 158 342, 158 282 C 158 236, 182 206, 204 184 C 206 214, 218 236, 238 246 C 228 196, 236 146, 256 92 Z" fill="url(#flame-outer)" />
      <path d="M264 168 C 292 212, 320 240, 320 294 C 320 336, 292 364, 256 364 C 220 364, 194 336, 194 298 C 194 268, 208 250, 224 236 C 226 258, 234 272, 248 280 C 242 240, 248 204, 264 168 Z" fill="url(#flame-mid)" />
      <path d="M260 250 C 276 274, 292 292, 292 320 C 292 342, 278 356, 256 356 C 234 356, 220 342, 220 322 C 220 304, 230 292, 240 284 C 242 298, 248 306, 256 308 C 252 290, 252 272, 260 250 Z" fill="url(#flame-core)" />
    </g>

    <!-- Pellet pile, ember glow behind it -->
    <ellipse cx="248" cy="378" rx="96" ry="26" fill="url(#ember)" />
    <use href="#pellet" transform="translate(212 382) rotate(12)" />
    <use href="#pellet" transform="translate(278 380) rotate(-10)" />
    <use href="#pellet" transform="translate(178 404) rotate(-8)" />
    <use href="#pellet" transform="translate(244 410) rotate(4)" />
    <use href="#pellet" transform="translate(308 404) rotate(-6)" />
  </g>

  <!-- Gauge badge -->
  <g filter="url(#badge-shadow)">
    <circle cx="400" cy="392" r="62" fill="url(#badge-grad)" />
    <circle cx="400" cy="392" r="62" fill="none" stroke="#FFFFFF" stroke-width="8" />
    <path d="M370 408 A 34 34 0 1 1 430 408" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <line x1="400" y1="398" x2="418" y2="372" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <circle cx="400" cy="398" r="8" fill="#FFFFFF" />
  </g>
</svg>
