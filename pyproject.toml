[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbe-blackstar"
dynamic = ["version"]
description = "NBE Black Star (Blackstar+, RTB) pellet burner bridge for Home Assistant (MQTT)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "paho-mqtt==2.1.0",
    "pycryptodome==3.23.0",
]

[project.urls]
Homepage = "https://github.com/macokay/nbe-blackstar"
Issues = "https://github.com/macokay/nbe-blackstar/issues"
Changelog = "https://github.com/macokay/nbe-blackstar/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "nbe_blackstar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbe_blackstar = ["nbe_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
